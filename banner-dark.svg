    <svg x="944" y="156" width="56" height="56" viewBox="0 0 128 128"><defs><linearGradient id="notewing-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d6af5"/><stop offset="1" stop-color="#4338ca"/></linearGradient></defs><rect width="128" height="128" rx="28" fill="url(#notewing-g)"/><path fill="#fff" d="M30 94c6-30 30-54 70-62-5 13-15 22-29 27 13 1 22-2 30-7-6 15-19 24-37 26 11 2 20 1 27-3-9 14-29 22-55 19z"/><path d="M30 94 22 104" stroke="#fff" stroke-width="7" stroke-linecap="round"/></svg>
