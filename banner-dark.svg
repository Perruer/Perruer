    <text x="1010" y="202" font-size="12" fill="#2ea043">● revived</text>
  </g>
  <g class="f f4">
    <rect x="732" y="222" width="176" height="92" rx="16" fill="#161b22" stroke="#30363d"/>
    <svg x="746" y="240" width="56" height="56" viewBox="0 0 128 128">
