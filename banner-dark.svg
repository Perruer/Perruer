<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Perruer: giving abandoned open-source projects a second life">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b33"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6d6af5" stop-opacity="0.35"/><stop offset="1" stop-color="#6d6af5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="340" rx="18"/></clipPath>
  </defs>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .f { animation: float 6s ease-in-out infinite; }
    .f1 { animation-delay: -1.2s; } .f2 { animation-delay: -2.4s; } .f3 { animation-delay: -3.6s; } .f4 { animation-delay: -4.8s; } .f5 { animation-delay: -6s; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    .spark { animation: blink 3s ease-in-out infinite; }
    .s2 { animation-delay: -1s; } .s3 { animation-delay: -2s; }
    @keyframes blink { 0%, 100% { opacity: .15; } 50% { opacity: 1; } }
    .dash { stroke-dasharray: 6 8; animation: flow 2.4s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    @media (prefers-reduced-motion: reduce) { .f, .spark, .dash { animation: none; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <circle cx="930" cy="170" r="260" fill="url(#glow)"/>

    <text x="64" y="104" font-size="20" fill="#8a84ff" font-weight="600">Hi there 👋, I'm</text>
    <text x="62" y="170" font-size="64" font-weight="800" fill="#e6edf3" letter-spacing="-2">Perruer</text>
    <text x="64" y="214" font-size="23" fill="#e6edf3">Giving abandoned open-source projects a second life</text>
    <text x="64" y="252" font-size="16" fill="#8b949e">Browser extensions · Web apps · CLI tools · Always crediting the original authors</text>

    <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">
      <rect x="64" y="276" width="222" height="30" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="78" y="296" fill="#8b949e">$ git commit -m <tspan fill="#8a84ff">"revive ✓"</tspan></text>
    </g>

    <path class="dash" d="M706 300 C 724 200, 700 120, 752 70" fill="none" stroke="#8a84ff" stroke-width="2" stroke-opacity=".6"/>
    <path class="dash" d="M1145 60 C 1180 140, 1170 230, 1125 262" fill="none" stroke="#8a84ff" stroke-width="2" stroke-opacity=".45"/>
    <g fill="#8a84ff">
      <path class="spark" d="M712 176l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/>
      <path class="spark s2" d="M1150 300l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/>
      <path class="spark s3" d="M905 26l3 6 6 3-6 3-3 6-3-6-6-3 6-3z"/>
